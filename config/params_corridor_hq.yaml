lio_sam:

  # Topics
  pointCloudTopic: "/velodyne_points"          # Point cloud data
  imuTopic: "/imu/data"                        # IMU data
  odomTopic: "/odom"                            # Wheel odometry (drift-free velocity)
  gpsTopic: "odometry/gpsz"                    # GPS odometry topic

  # Frames
  lidarFrame: "base_link"
  baselinkFrame: "base_link"
  odometryFrame: "odom"
  mapFrame: "map"

  # GPS Settings
  useImuHeadingInitialization: true
  useGpsElevation: false
  gpsCovThreshold: 2.0
  poseCovThreshold: 25.0

  # Export settings
  savePCD: true
  savePCDDirectory: "/home/clh/catkin_ws/bags/paper_comparison/"

  # Sensor Settings
  sensor: velodyne
  N_SCAN: 16
  Horizon_SCAN: 1800
  downsampleRate: 1
  lidarMinRange: 1.0
  lidarMaxRange: 1000.0

  # IMU Settings
  imuAccNoise: 3.9939570888238808e-03
  imuGyrNoise: 1.5636343949698187e-03
  imuAccBiasN: 6.4356659353532566e-05
  imuGyrBiasN: 3.5640318696367613e-05
  imuGravity: 9.80511
  imuRPYWeight: 0.05

  # Extrinsics: T_lb (lidar -> imu)
  extrinsicTrans: [0.0, 0.0, 0.0]
  extrinsicRot: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]
  extrinsicRPY: [1, 0, 0,
                 0, 1, 0,
                 0, 0, 1]

  # LOAM feature threshold (lowered for corridor - sparse features)
  edgeThreshold: 0.1
  surfThreshold: 0.03
  edgeFeatureMinValidNum: 5
  surfFeatureMinValidNum: 50

  # voxel filter params
  odometrySurfLeafSize: 0.2                   # indoor corridor (was 0.4 outdoor)
  mappingCornerLeafSize: 0.1
  mappingSurfLeafSize: 0.2

  # Robot motion constraint
  z_tollerance: 1000
  rotation_tollerance: 1000

  # CPU Params
  numberOfCores: 4
  mappingProcessInterval: 0.15

  # Surrounding map
  surroundingkeyframeAddingDistThreshold: 0.5
  surroundingkeyframeAddingAngleThreshold: 0.1
  surroundingKeyframeDensity: 1.0
  surroundingKeyframeSearchRadius: 50.0

  # Loop closure (VGICP) — disabled: corridor perceptual aliasing causes false positives
  loopClosureEnableFlag: false
  loopClosureFrequency: 2.0
  surroundingKeyframeSize: 50
  historyKeyframeSearchRadius: 50.0
  historyKeyframeSearchTimeDiff: 10.0
  historyKeyframeSearchNum: 50
  historyKeyframeFitnessScore: 0.5

  # VGICP parameters
  vgicpVoxelResolution: 1.0
  vgicpNeighborRadius: 1.5
  vgicpMaxIterations: 30
  vgicpConvergenceThreshold: 0.001
  vgicpDistanceThreshold: 5.0

  # Visualization
  globalMapVisualizationSearchRadius: 1000.0
  globalMapVisualizationPoseDensity: 1.0
  globalMapVisualizationLeafSize: 0.1


navsat:
  frequency: 50
  wait_for_datum: false
  delay: 0.0
  magnetic_declination_radians: 0
  yaw_offset: 0
  zero_altitude: true
  broadcast_utm_transform: false
  broadcast_utm_transform_as_parent_frame: false
  publish_filtered_gps: false

